[workspace]
resolver = "2"
members = [
	"crates/pds2",
	"crates/pds2-cli",
	"crates/pds2-core",
	"crates/pds2-specializer-bytes",
	"crates/pds2-specializer-generic",
	"crates/pds2-specializer-protodef",
	"crates/pds2-specializer-minecraft-data",
	"crates/pds2-specializer-protobuf",
	"crates/pds2-specializer-csn1",
	"crates/pds2-specializer-bifrostlink",
	"crates/lang-tests",
	"crates/csn1-tests",
	"crates/pds-bytes-runtime",
	"crates/pds-bits-runtime",
	"crates/protobuf-descriptor",
]
default-members = ["crates/pds2"]

[workspace.package]
license = "MIT"
edition = "2024"

[workspace.dependencies]
pds-bits-runtime = { path = "crates/pds-bits-runtime", version = "0.1.1" }
pds-bytes-runtime = { path = "crates/pds-bytes-runtime", version = "0.1.3" }
pds2-cli = { path = "crates/pds2-cli", version = "0.2.0" }
pds2-core = { path = "crates/pds2-core", version = "0.2.0" }
pds2-specializer-bifrostlink = { path = "crates/pds2-specializer-bifrostlink", version = "0.1.2" }
pds2-specializer-bytes = { path = "crates/pds2-specializer-bytes", version = "0.1.2" }
pds2-specializer-csn1 = { path = "crates/pds2-specializer-csn1", version = "0.1.2" }
pds2-specializer-generic = { path = "crates/pds2-specializer-generic", version = "0.1.2" }
pds2-specializer-minecraft-data = { path = "crates/pds2-specializer-minecraft-data", version = "0.2.0" }
pds2-specializer-protobuf = { path = "crates/pds2-specializer-protobuf", version = "0.1.2" }
pds2-specializer-protodef = { path = "crates/pds2-specializer-protodef", version = "0.1.2" }
protobuf-descriptor = { path = "crates/protobuf-descriptor", version = "0.1.1" }

Inflector = "0.11.4"
anyhow = "1.0"
bitflags = "2.5.0"
clap = "4.5"
dprint-core = "0.70.0"
genco = "0.20"
heck = "0.5"
peg = "0.8.2"
psm = "0.1.32"
serde_json = "1.0"
sha3 = "0.10"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
