[package]
name = "pds2"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
Inflector = "0.11.4"
anyhow = "1.0"
bitflags = "2.5.0"
clap = { version = "4.5", features = ["derive"] }
derivative = "2.2"
dprint-core = "0.66.1"
genco = "0.17.8"
peg = "0.8.2"
rand = "0.8.5"
serde_json = "1.0"

[features]
trace = ["peg/trace"]

[workspace]
members = ["example/rust"]
