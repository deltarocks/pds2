[package]
name = "tree-sitter-pds"
description = "pds grammar for the tree-sitter parsing library"
version = "0.0.1"
keywords = ["incremental", "parsing", "pds"]
categories = ["parsing", "text-editors"]
edition = "2018"
license = "MIT"

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter = "0.19.5"

[build-dependencies]
cc = "1.0"
